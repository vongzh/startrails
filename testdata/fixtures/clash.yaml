proxies:
  - name: "Clash SS"
    type: ss
    server: ss.example.invalid
    port: 8388
    cipher: aes-128-gcm
    password: placeholder-ss
    udp: true
  - name: "Clash VMess"
    type: vmess
    server: vmess.example.invalid
    port: 443
    uuid: 11111111-1111-1111-1111-111111111111
    alterId: 0
    cipher: auto
    tls: true
    servername: vmess.example.invalid
    network: ws
  - name: "Unsupported Hysteria2"
    type: hysteria2
    server: h2.example.invalid
    port: 443
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - "Clash SS"
      - "Clash VMess"
rule-providers:
  remote:
    url: https://example.invalid/ruleset.yaml
    type: http
