  <title id="st-title">Startrails · 星迹</title>
  <desc id="st-desc">三条同心星迹、缺口处一颗琥珀色四芒星的线稿标记，配英文标准字 Startrails 与中文名「星迹」。</desc>
  <!--
    Startrails 横版标志 · 中英双语 · 固定深底配色，专用于深色背景
    定稿 F：夜蓝三阶实色（#1b2138 / #4c5773 / #818ca6）+ 琥珀星点（#c9861d）。
    这三阶是本产品的品牌色，与控制台的 5 套主题色无关，切换配色时不变。
    无底色。图形骨架与 web/public/favicon.svg、web/src/components/BrandMark.vue 同源；
    这里是大尺寸用的三弧形。标准字为活字（text），依赖字体栈，不是路径。
  -->
