name: Docker

# 发版才出镜像：先跑完整 verify，再交叉构建 linux/amd64 + linux/arm64。
# 默认推 GitHub Container Registry（内置 GITHUB_TOKEN，零配置）；
# 另配 DOCKERHUB_USERNAME（Variable）+ DOCKERHUB_TOKEN（Secret）就同时推 Docker Hub。
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      push:
        description: 构建完成后推送到镜像仓库
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 与 ci.yml 同一条链。镜像不该由没过测试的 commit 产出，所以不省这一步。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm run typecheck:ui
      - run: npm run build:ui
      - run: npm test
      - run: npm run drill:backup

  # 版本号取自 git tag；tag 与 package.json 不一致就直接失败，不发半成品镜像。
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_tag: ${{ steps.v.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - id: v
        run: |
          PKG=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PKG" ]; then
              echo "::error::git tag ${GITHUB_REF_NAME} 与 package.json 的 ${PKG} 不一致；先改版本号（三处）再打 tag"
              exit 1
            fi
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="$PKG"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi
          echo "版本 $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      IS_TAG: ${{ needs.resolve.outputs.is_tag }}
      SHOULD_PUSH: ${{ github.event_name == 'push' || inputs.push == true }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 注册 arm64 模拟器
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # `latest` 只在正式 tag 上移动；手动触发只出 sha 短标签，不抢 latest。
      - name: 计算镜像标签
        id: meta
        run: |
          SHA=$(git rev-parse --short=7 HEAD)
          TAGS="${IMAGE}:${VERSION},${IMAGE}:sha-${SHA}"
          if [ "$IS_TAG" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest"
          fi
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            TAGS="${TAGS},docker.io/${DOCKERHUB_USERNAME}/startrails:${VERSION}"
            if [ "$IS_TAG" = "true" ]; then
              TAGS="${TAGS},docker.io/${DOCKERHUB_USERNAME}/startrails:latest"
            fi
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "本次发布："
          echo "$TAGS" | tr ',' '\n' | sed 's/^/  /'

      - name: 登录 GHCR
        if: env.SHOULD_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub（配了凭据才执行）
        if: env.SHOULD_PUSH == 'true' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # 必须显式退回 Docker media type：buildx 默认按 OCI 输出，而 HEALTHCHECK
          # 是 Docker config 的扩展字段，OCI 清单会把它丢掉 —— 镜像看着正常，但
          # podman/docker inspect 拿到的 healthcheck 是 null，编排层不会做存活探测。
          # push 也放进 outputs：同时给 push: 与 outputs: 时后者优先，容易看错。
          outputs: type=image,push=${{ env.SHOULD_PUSH == 'true' }},oci-mediatypes=false
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Startrails
            org.opencontainers.image.description=把订阅源扇出成多个客户端订阅地址的常驻服务
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
